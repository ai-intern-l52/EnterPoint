<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>載入中…</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
      background: #F5F6F8;
      color: #16181D;
    }

    /* import loading animation */
    .loader {
      width: min(240px, 60vw);
      height: auto;
      display: block;
    }

    .msg {
      font-size: 14px;
      color: rgba(22, 24, 29, 0.6);
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <img class="loader" src="loading-image-svg.gif" width="1080" height="1080" alt="載入中">
  <div class="msg" id="msg">載入中…<br>若讀取較慢請耐心等候</div>

  <!-- login error log display -->
  <div id="err"
    style="display:none; margin-top:16px; max-width:300px; font-size:13px; line-height:1.6;
    color:#B00020; background:#FDECEE; border:1px solid #F5C2C7; border-radius:8px; padding:10px 12px; text-align:center;">
  </div>

  <!-- login error retry exit -->
  <button id="retry" type="button" style="display:none; margin-top:16px; border:0; cursor:pointer;
    background:#30BAC4; color:#fff; font-size:15px; padding:11px 30px; border-radius:999px;
    font-family:inherit;">重新登入
  </button>

  <!-- LIFF Line ID Entry -->
  <script>
    var LIFF_ID = '2010821918-1M2BovKM';
    var RETRY_KEY = 'liff_relogin_once';

    // 同一個落地頁、同一個 LIFF app,以 ?to= 分流到不同的 GAS 系統。
    //   訂購:https://liff.line.me/2010821918-1M2BovKM
    //   註冊:https://liff.line.me/2010821918-1M2BovKM?to=register
    // LIFF 會把 LIFF URL 上的 query 原封不動帶到 endpoint,所以不需要第二個 LIFF app。
    // ⚠️ 只認白名單裡的 key,對不上一律回 order,避免被塞任意網址當跳板。
    var TARGETS = {
      order: {
        url: 'https://script.google.com/macros/s/AKfycbyC1PheOY6vscOQzOLjzQsIP3ydoxAeW250nD5ISPW_Ykptq-Tp35CEIESnM3_eQBT5dQ/exec',
        msg: '正在載入產品庫…<br>若讀取較慢請耐心等候'
      },
      register: {
        // TODO:部署「用戶註冊」GAS 專案後,把這裡換成它的 /exec 網址
        url: 'https://script.google.com/macros/s/AKfycbyQr3cPbiIZEJLxAckwkSpyE98PojYjQ9XLpYcrTvOy8rPbbLsjWFZyImPISUppgPzTwQ/exec',
        msg: '正在確認您的 LINE 帳號…<br>馬上就好'
      }
    };
    var TARGET_KEY = 'liff_target';
    var TARGET_PENDING_KEY = 'liff_target_pending';

    function ss(action, key, value) {
      try {
        if (action === 'get') return sessionStorage.getItem(key) || '';
        if (action === 'set') sessionStorage.setItem(key, value);
        if (action === 'del') sessionStorage.removeItem(key);
      } catch (e) { }
      return '';
    }

    // 決定要去哪個系統。優先序:
    //   1. 網址上的 ?to=
    //   2. liff.state 裡包起來的 ?to=(從 liff.line.me 進來、SDK 還沒展開之前)
    //   3. 只有在「剛從 LINE 登入頁轉回來」時,才讀 sessionStorage 記住的值
    // 第 3 點刻意加上 pending 旗標:登入導回時網址會被清成乾淨路徑,參數會掉,
    // 但若無條件信任 sessionStorage,同一個分頁稍後再開訂購入口(沒帶 ?to=)
    // 會被上一次的 register 記憶帶錯地方。旗標只在 liff.login() 前設,用完就清。
    // ⚠️ 也不能把 to 塞進 loginRedirectUri:登入後要回來的網址必須是乾淨路徑,
    //    帶參數會與 liff.state 互相打架,造成登入頁與本頁無限來回。
    function resolveTargetKey() {
      var search = location.search || '';

      var direct = /[?&]to=([A-Za-z]+)/.exec(search);
      if (direct) return direct[1];

      var state = /[?&]liff\.state=([^&]*)/.exec(search);
      if (state) {
        var decoded = '';
        try { decoded = decodeURIComponent(state[1]); } catch (e) { decoded = state[1]; }
        var inner = /(?:[?&]|^)to=([A-Za-z]+)/.exec(decoded);
        if (inner) return inner[1];
      }

      if (ss('get', TARGET_PENDING_KEY)) {
        ss('del', TARGET_PENDING_KEY);
        return ss('get', TARGET_KEY);
      }
      return '';
    }

    var TARGET_NAME = resolveTargetKey();
    if (!Object.prototype.hasOwnProperty.call(TARGETS, TARGET_NAME)) TARGET_NAME = 'order';
    ss('set', TARGET_KEY, TARGET_NAME);

    var TARGET = TARGETS[TARGET_NAME];
    document.getElementById('msg').innerHTML = TARGET.msg;

    // 轉去 LINE 登入前先立旗標,讓導回來時還認得原本要去哪個系統
    function loginAndRemember() {
      ss('set', TARGET_PENDING_KEY, '1');
      liff.login({ redirectUri: loginRedirectUri() });
    }

    function goToApp(sessionId) {
      var url = TARGET.url;
      if (sessionId) url += '?token=' + encodeURIComponent(sessionId);
      location.replace(url);
    }

    function loginRedirectUri() {
      return location.origin + location.pathname;
    }

    function idTokenExpired() {
      try {
        var d = liff.getDecodedIDToken();
        if (!d || !d.exp) return false;
        return d.exp * 1000 - Date.now() <= 60000; // 剩不到 60 秒也當過期
      } catch (e) {
        return false;
      }
    }

    function fail(reason) {
      if (settled) return;
      settled = true;
      document.querySelector('.loader').style.display = 'none';
      document.getElementById('msg').textContent = '無法登入';
      var el = document.getElementById('err');
      if (el) {
        el.textContent = '登入未完成:' + reason + '。請按下方按鈕重試,或改由 LINE 官方帳號的選單進入。';
        el.style.display = 'block';
      }
      var btn = document.getElementById('retry');
      if (btn) btn.style.display = 'inline-block';
    }

    // Retry Login Section
    document.getElementById('retry').addEventListener('click', function () {
      ss('del', RETRY_KEY);
      ss('set', TARGET_PENDING_KEY, '1'); // 重整後網址會變乾淨路徑,靠旗標記住原本要去的系統
      try {if (liff.isLoggedIn()) liff.logout();} catch (e) { }
      location.replace(loginRedirectUri());
    });

    var settled = false;
    setTimeout(function () {
      if (!settled) fail('連線逾時(10 秒)');
    }, 10000);

    // Logout Function
    var IS_LOGOUT = location.search.indexOf('logout=1') >= 0;

    liff.init({liffId: LIFF_ID}).then(function () {
      if (IS_LOGOUT) {
        if (liff.isLoggedIn()) liff.logout();
        settled = true;
        document.querySelector('.loader').style.display = 'none';
        document.getElementById('msg').textContent = '已登出此裝置,可以安全地離開了。';
        return null;
      }

      if (!liff.isLoggedIn()) {
        // Redirect to Line Official Login Page
        loginAndRemember();
        return null;
      }

      return liff.getProfile();
    }).then(function (profile) {
      if (!liff.isLoggedIn()) return;
      if (!profile) {
        fail('無法取得使用者資料(profile)');
        return;
      }

      if (idTokenExpired() && !ss('get', RETRY_KEY)) {
        ss('set', RETRY_KEY, '1');
        ss('set', TARGET_PENDING_KEY, '1'); // 重整後網址會變乾淨路徑,靠旗標記住原本要去的系統
        liff.logout();
        location.replace(loginRedirectUri());
        return;
      }

      ss('del', RETRY_KEY);

      var idToken = liff.getIDToken();
      if (!idToken) {
        fail('無法取得 idToken');
        return;
      }

      return fetch(TARGET.url, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({
          userId: profile.userId,
          displayName: profile.displayName || '',
          idToken: idToken
        })
      }).then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      }).then(function (result) {
        if (result.success && result.sessionId) {
          settled = true;
          goToApp(result.sessionId);
        } else {
          fail('GAS 回應失敗:' + (result.error || '未知'));
        }
      });
    }).catch(function (err) {
      fail((err && err.message) || '初始化錯誤');
    });
  </script>
</body>

</html>

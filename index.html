<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>載入中…</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
    background: #F5F6F8; color: #16181D;
  }
  .spinner {
    width: 40px; height: 40px; border: 4px solid #E2F5F6; border-top-color: #30BAC4;
    border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { font-size: 14px; color: rgba(22,24,29,0.6); }
</style>
</head>
<body>
  <div class="spinner"></div>
  <div class="msg" id="msg">正在載入訂購系統…</div>
  <!-- 只在登入失敗時才顯示的極簡錯誤列;正常流程完全看不到 -->
  <div id="err" style="display:none; margin-top:16px; max-width:300px; font-size:13px; line-height:1.6;
    color:#B00020; background:#FDECEE; border:1px solid #F5C2C7; border-radius:8px; padding:10px 12px; text-align:center;"></div>

<script>
  // ========================================================================
  // LIFF 身份驗證入口(必須放在「非 iframe」的靜態空間,例如 GitHub Pages)
  //
  // 流程:
  // 1. liff.init() + liff.login() + liff.getProfile()
  // 2. 取得 idToken (liff.getIDToken())
  // 3. fetch POST 到 GAS /exec,傳 { userId, displayName, idToken }
  // 4. GAS 驗證並建立會話,回傳 sessionId
  // 5. redirect 到 GAS /exec?sid=sessionId
  // 6. GAS 的 doGet 檢查會話,注入身份到訂購頁面
  //
  // 為什麼要這樣:GAS 的頁面被包在巢狀 iframe,LIFF 無法初始化。
  // 改在 GitHub Pages(頂層)驗證身份,然後用 POST + session 告訴 GAS。
  // ========================================================================
  var LIFF_ID = '2010821918-1M2BovKM';
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbyC1PheOY6vscOQzOLjzQsIP3ydoxAeW250nD5ISPW_Ykptq-Tp35CEIESnM3_eQBT5dQ/exec';

  function goToApp(sessionId) {
    var url = GAS_URL;
    // ⚠️ 參數名不能用 sid:sid 是 Google 基礎架構的保留參數,有值時會被攔截回 400。
    if (sessionId) url += '?token=' + encodeURIComponent(sessionId);
    location.replace(url);
  }

  // 登入失敗時:先把原因顯示出來(不再默默掉訪客),讓人能看到問題;5 秒後仍以訪客身分進入,不擋客戶下單。
  function fail(reason) {
    if (settled) return;
    settled = true;
    var el = document.getElementById('err');
    if (el) {
      el.textContent = '⚠️ 登入未完成:' + reason + '。5 秒後以訪客身分進入…';
      el.style.display = 'block';
    }
    document.getElementById('msg').textContent = '登入未完成';
    setTimeout(function () { goToApp(''); }, 5000);
  }

  var settled = false;
  setTimeout(function () {
    if (!settled) fail('連線逾時(10 秒)');
  }, 10000);

  liff.init({ liffId: LIFF_ID }).then(function () {
    if (!liff.isLoggedIn()) {
      // 尚未登入(桌機瀏覽器很常見)→ 導向 LINE 登入。這行會讓瀏覽器跳轉離開本頁,
      // 登入完成後帶著登入狀態回到本頁重跑一次。不要在這裡當成失敗。
      liff.login({ redirectUri: location.href });
      return null;
    }
    return liff.getProfile();
  }).then(function (profile) {
    // 正在導向 LINE 登入(尚未登入)→ 頁面即將跳轉,不可誤判為失敗、也不要提早掉訪客;
    // 萬一跳轉沒發生,最上面的 10 秒逾時仍會接手。
    if (!liff.isLoggedIn()) return;
    if (!profile) {
      fail('無法取得使用者資料(profile)');
      return;
    }
    var idToken = liff.getIDToken();
    if (!idToken) {
      fail('無法取得 idToken');
      return;
    }
    // 用 text/plain 避開 CORS 預檢(GAS 無法回應 preflight OPTIONS)。
    // body 照樣是 JSON 字串,GAS 端用 JSON.parse(e.postData.contents) 解析。
    return fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        userId: profile.userId,
        displayName: profile.displayName || '',
        idToken: idToken
      })
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function (result) {
      if (result.success && result.sessionId) {
        settled = true;
        goToApp(result.sessionId);
      } else {
        fail('GAS 回應失敗:' + (result.error || '未知'));
      }
    });
  }).catch(function (err) {
    fail((err && err.message) || '初始化錯誤');
  });
</script>
</body>
</html>
